services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boardrent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boardrent-local}
      POSTGRES_DB: ${POSTGRES_DB:-boardrent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - boardrent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-boardrent}:${POSTGRES_PASSWORD:-boardrent-local}@db:5432/${POSTGRES_DB:-boardrent}?schema=public
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      PORT: 3000
      TZ: Europe/Warsaw
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  boardrent-postgres-data:
